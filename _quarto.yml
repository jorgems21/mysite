project:
  type: website
  output-dir: docs
execute:
  freeze: auto
profile:
  default: english
  group: [english,spanish]
website:
  site-url: https://jorgems21.github.io/mysite
  title: "Jorge Montoya"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Work
      - href: about_me.qmd
        text: About
      - href: my_resume.pdf
        text: Resume (PDF)
      - href: contact_me.qmd
        text: Contact
  page-footer:
    right: "Built with ❤️ and [Quarto](https://quarto.org/)."

format:
  html:
    theme:
      light: [flatly, theme.scss]
      dark: [darkly, theme-dark.scss, theme.scss]
    css: styles.css
    toc: true
    code-fold: true
    code-copy: true
    code-overflow: wrap

editor: visual
